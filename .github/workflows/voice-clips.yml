name: voice-clips
on:
  workflow_dispatch:
  push:
    branches: [voice-clips]
    paths: ['tools/voice/**', '.github/workflows/voice-clips.yml']
permissions:
  contents: write
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Piper and ffmpeg
        run: |
          pip install piper-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download the Arabic male voice (ar_JO-kareem) and its model card
        run: |
          mkdir -p voice && cd voice
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium
          curl -sSL -o kareem.onnx "$B/ar_JO-kareem-medium.onnx"
          curl -sSL -o kareem.onnx.json "$B/ar_JO-kareem-medium.onnx.json"
          curl -sSL -o MODEL_CARD "$B/MODEL_CARD"
          echo "===== MODEL_CARD ====="; cat MODEL_CARD; echo; echo "======================"
          ls -la
      - name: Generate clips
        run: python tools/voice/make_clips.py voice/kareem.onnx out
      - name: Compress (mono AAC m4a + mp3)
        run: |
          mkdir -p out/m4a out/mp3
          for f in out/*.wav; do n=$(basename "$f" .wav)
            ffmpeg -v error -y -i "$f" -af "silenceremove=start_periods=1:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_threshold=-50dB,areverse" -ac 1 -c:a aac -b:a 48k "out/m4a/$n.m4a"
            ffmpeg -v error -y -i "$f" -ac 1 -c:a libmp3lame -b:a 48k "out/mp3/$n.mp3"; done
          cp voice/MODEL_CARD out/
          du -sh out/m4a out/mp3
      - name: Commit clips back to this branch
        run: |
          rm -rf voice-out && mkdir -p voice-out
          cp -r out/m4a out/mp3 out/MODEL_CARD out/phrases.json voice-out/
          cp voice/kareem.onnx.json voice-out/voice-config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-out
          git commit -m "Generated voice clips [skip ci]" || echo "nothing to commit"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: voice-clips
          path: |
            out/m4a
            out/mp3
            out/MODEL_CARD
            out/phrases.json
