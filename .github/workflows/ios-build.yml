# Al-Zij iPhone app — builds on GitHub's Mac machines (Hassan has no Mac).
# Runs on every push to the ios-app branch that touches app/ or the web app.
# TestFlight: push a tag named ios-v<version>-<n> (e.g. ios-v1.0.0-1) — works from this branch, no merge to main needed.
# (The «Run workflow» button only appears once this file is also on the default branch.)
# It never deploys the website and never touches main.
name: iOS build

on:
  push:
    branches: [ios-app]
    tags: ['ios-v*']
    paths: ['app/**', 'index.html', '*.js', 'voice/**', 'data/uq/**', 'data/my/**', 'fonts/**', 'icons/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also sign and upload to TestFlight (needs the App Store Connect secrets — see app/README.md)'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Alert planner tests (Linux)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Bundle the web app into app/www
        run: npm run bundle
        env: { CI: '1' }
      - name: End-to-end check of the bridge in the real page (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:e2e

  ios-simulator:
    name: Build for the iOS simulator (unsigned)
    needs: test
    runs-on: macos-26
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: xcodebuild -version
      - run: npm install --no-audit --no-fund
      - name: Bundle the web app
        run: npm run bundle
        env: { CI: '1' }
      - name: Create the iOS project (generated fresh each time; app/ios is not kept in git)
        run: npx cap add ios
      - name: Apply Al-Zij native settings (name, icon, sounds, privacy manifest, iPhone only)
        run: bash ios-config/configure-ios.sh
        env:
          ZIJ_BUILD_NUMBER: ${{ github.run_number }}
      - run: npx cap sync ios
      - name: Build (simulator, no signing)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then SRC="-workspace ios/App/App.xcworkspace"; else SRC="-project ios/App/App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Check the built app
        run: |
          APPB=$(find build/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          echo "built: $APPB"
          test -f "$APPB/public/index.html"
          grep -q 'zij-native' "$APPB/public/index.html"
          test -f "$APPB/public/data/uq/c/74.json"
          test -f "$APPB/PrivacyInfo.xcprivacy"
          # every script the page loads is in the app (review 18 Nov, item 1), and the privacy guard (#98)
          for f in variants.js voice.js home-designs.js native/zij-privacy.js data/my/index.json; do test -f "$APPB/public/$f" || { echo "::error::missing public/$f"; exit 1; }; done
          ls "$APPB/public/voice" | head -3
          # the app's own plugin (Apple place names, #98) is compiled in, and the storyboard starts the view controller that registers it
          grep -aq ZijGeocoderPlugin "$APPB/App" || { echo "::error::ZijGeocoderPlugin is not in the binary"; exit 1; }
          grep -raq ZijViewController "$APPB/Base.lproj/Main.storyboardc" || { echo "::error::Main.storyboard does not use ZijViewController"; exit 1; }
          ls "$APPB"/*.wav
          # Time Sensitive entitlement wired into the project (#71); signing itself is checked in the TestFlight job
          plutil -lint ios/App/App/App.entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements' ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APPB/Info.plist"
          du -sh "$APPB"
      - name: Open the app in an iPhone simulator (Jeddah) and take screenshots
        run: |
          APPB=$(find build/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APPB"
          xcrun simctl location "$UDID" set 21.5433,39.1728 || true
          xcrun simctl privacy "$UDID" grant location com.alzijapp.app || true
          mkdir -p build/shots
          xcrun simctl launch "$UDID" com.alzijapp.app
          sleep 20; xcrun simctl io "$UDID" screenshot build/shots/1-after-20s.png
          sleep 25; xcrun simctl io "$UDID" screenshot build/shots/2-after-45s.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q com.alzijapp.app || { echo "::error::the app is not running 45 s after launch (crash?)"; exit 1; }
          echo "the app is still running after 45 s"
          # a small copy of the last screenshot in the log itself (readable where the artifact cannot be downloaded)
          sips -Z 420 build/shots/2-after-45s.png --out build/shots/small.png >/dev/null && sips -s format jpeg -s formatOptions 60 build/shots/small.png --out build/shots/small.jpg >/dev/null
          echo "ZIJ-SHOT-BEGIN"; base64 -i build/shots/small.jpg | fold -w 1000; echo "ZIJ-SHOT-END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: al-zij-simulator-shots
          path: app/build/shots
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: al-zij-simulator-app
          path: app/build/Build/Products/Release-iphonesimulator/App.app
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------
  # TODO (needs Hassan's Apple Developer account): signed build → TestFlight.
  # Add these repository secrets (Settings → Secrets and variables → Actions):
  #   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (the .p8 file's text) — App Store Connect → Users and Access → Integrations → Keys (role: App Manager)
  #   APPLE_TEAM_ID — developer.apple.com → Membership
  # and create the app record in App Store Connect with the same bundle id (com.alzijapp.app, proposal).
  # Start it with:  git tag ios-v1.0.0-1 && git push origin ios-v1.0.0-1   (version 1.0.0, build = the run number)
  #            or:  a commit on ios-app whose message contains [testflight]  (version 1.0.0 unless ZIJ_MARKETING_VERSION)
  # Not run yet: it can only be tested once the account and the secrets exist.
  # ---------------------------------------------------------------------------------------------------------
  testflight:
    name: Sign and upload to TestFlight
    needs: test
    # also from a push to ios-app whose commit message contains [testflight] (tags cannot be pushed from Claude's sessions)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/ios-v') || (github.event_name == 'push' && github.ref == 'refs/heads/ios-app' && contains(github.event.head_commit.message, '[testflight]')) }}
    runs-on: macos-26
    defaults: { run: { working-directory: app } }
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Secrets present?
        working-directory: .        # runs before the checkout, when app/ does not exist yet
        run: |
          for v in KEY_ID ISSUER TEAM; do [ -n "${!v}" ] || { echo "::error::secret for $v is missing — see app/README.md"; exit 1; }; done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm run bundle && npx cap add ios
        env: { CI: '1' }
      - name: Apply Al-Zij native settings
        run: |
          V="${GITHUB_REF_NAME#ios-v}"; V="${V%%-*}"; case "$V" in [0-9]*) export ZIJ_MARKETING_VERSION="$V";; esac
          bash ios-config/configure-ios.sh
        env: { ZIJ_BUILD_NUMBER: '${{ github.run_number }}' }
      - run: npx cap sync ios
      - name: API key file
        # the key text arrives as it was pasted (from a phone: line breaks may become spaces); rebuild a clean PEM from its base64 body
        env: { P8: '${{ secrets.APPSTORE_KEY_P8 }}' }
        run: |
          mkdir -p ~/private_keys
          python3 - "$HOME/private_keys/AuthKey_${KEY_ID}.p8" <<'PY'
          import os, re, sys, textwrap
          t = os.environ.get('P8', '')
          t = re.sub(r'(?i)(BEGIN|END)\s*(EC\s*)?PRIVATE\s*KEY', ' ', t)        # the two marker lines, whatever the dashes became
          body = re.sub(r'[^A-Za-z0-9+/=]', '', t)                                 # dashes, spaces, line breaks, anything pasted around it
          open(sys.argv[1], 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n')
          print('key body: %d base64 characters' % len(body))
          PY
          openssl pkey -in ~/private_keys/AuthKey_${KEY_ID}.p8 -noout 2>/dev/null || {
            echo "::error::APPSTORE_KEY_P8 is not a readable private key — paste the whole text of the .p8 file again (from -----BEGIN to END-----)"; exit 1; }
          echo "API key file OK"
      - name: Sign for the App Store and upload to TestFlight (fastlane — see app/fastlane/Fastfile)
        env: { FASTLANE_SKIP_UPDATE_CHECK: '1', FASTLANE_HIDE_CHANGELOG: '1', FASTLANE_DISABLE_COLORS: '1' }
        run: |
          command -v fastlane >/dev/null || brew install fastlane >/dev/null
          fastlane --version | tail -1
          fastlane ios testflight_upload
      - name: Entitlements of the uploaded app
        if: always()
        run: cat build/entitlements.txt 2>/dev/null || true
