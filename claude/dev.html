<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="/">
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="الزيج — تصميم Claude للحاسوب: مواقيت الصلاة والقبلة والسماء، دون إنترنت ودون إعلانات.">
<title>الزيج</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="claude/zij.css?v=1">
</head>
<body data-scr="clock">
<div id="skybg" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="badge" aria-hidden="true">CLAUDE · تصميم الحاسوب</div>
<a class="sr" href="#main" data-t="تخطَّ إلى المحتوى|Skip to content"></a>

<div class="app">
  <nav class="rail" data-tl="الشاشات|Screens">
    <a class="brand" href="claude/#clock" aria-hidden="true" tabindex="-1">
      <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" stroke="url(#bg1)" stroke-width="2"/><circle cx="24" cy="24" r="14" stroke="#8ab6ff" stroke-opacity=".5" stroke-dasharray="2 3"/>
        <path d="M24 5v6M24 37v6M5 24h6M37 24h6" stroke="#f2c46d" stroke-width="2" stroke-linecap="round"/><circle cx="31" cy="15" r="4" fill="#ffd76a"/><path d="M24 24 15 31" stroke="#eef1f8" stroke-width="2.4" stroke-linecap="round"/><circle cx="24" cy="24" r="2.6" fill="#f2c46d"/>
        <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe0a0"/><stop offset="1" stop-color="#8a6526"/></linearGradient></defs></svg>
      <b data-t="الزيج|Al-Zij"></b>
    </a>
    <div class="nav">
      <button type="button" data-go="clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.6" stroke-dasharray="1.2 2"/><path d="M12 12V7.2M12 12l3.4 2.2" stroke-linecap="round"/></svg><span data-t="الساعة|Clock"></span><kbd>1</kbd></button>
      <button type="button" data-go="prayer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 20.5V11a7 7 0 0 1 14 0v9.5"/><path d="M3 20.5h18M12 4V2.5M9.2 20.5V15a2.8 2.8 0 0 1 5.6 0v5.5"/></svg><span data-t="الصلاة|Prayer"></span><kbd>2</kbd></button>
      <button type="button" data-go="qibla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8.5 12 5l7 3.5v8L12 20l-7-3.5z"/><path d="M5 11.2l7 3.4 7-3.4" stroke="#f2c46d"/></svg><span data-t="القبلة|Qibla"></span><kbd>3</kbd></button>
      <button type="button" data-go="sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15.5 3.6A8.6 8.6 0 1 0 20.4 15 7 7 0 0 1 15.5 3.6Z"/><path d="M18.5 3.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="currentColor" stroke="none"/></svg><span data-t="السماء|Sky"></span><kbd>4</kbd></button>
      <button type="button" data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round"/></svg><span data-t="المزيد|More"></span><kbd>5</kbd></button>
    </div>
    <div class="rail-foot">
      <button type="button" class="mini" id="langBtn"></button>
      <button type="button" class="mini num" id="digBtn" data-tl="شكل الأرقام|Digits"></button>
    </div>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <header class="top">
      <h1 id="scrTitle"></h1>
      <span class="grow"></span>
      <button type="button" class="nextpill" id="nextPill"><span></span><b class="num"></b></button>
      <button type="button" class="place" id="placeBtn" data-tl="الموقع — اضغط لتغييره|Location — click to change"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="placeTxt">—</span></button>
    </header>
    <section class="scr" id="scr-clock" aria-labelledby="scrTitle"></section>
    <section class="scr" id="scr-prayer" aria-labelledby="scrTitle"></section>
    <section class="scr" id="scr-qibla" aria-labelledby="scrTitle"></section>
    <section class="scr" id="scr-sky" aria-labelledby="scrTitle"></section>
    <section class="scr" id="scr-more" aria-labelledby="scrTitle"></section>
  </main>
</div>

<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="alertBanner" role="alert" hidden><div class="t"></div><div class="s"></div><div class="row"><button type="button" class="btn" id="alertClose" data-t="إغلاق|Close"></button></div></div>
<button type="button" class="btn" id="exitDisplay" data-t="خروج من العرض الكامل|Exit full display"></button>

<script src="claude/engine.js?v=1"></script>
<script src="claude/app.js?v=1"></script>
<script src="claude/dials.js?v=1"></script>
<script src="claude/screens.js?v=1"></script>
<script src="claude/screens2.js?v=1"></script>
<script>boot();</script>
</body>
</html>
